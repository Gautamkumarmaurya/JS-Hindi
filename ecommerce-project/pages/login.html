<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - ShopZone</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>

<body>

    <header class="header">

        <div class="logo">
            <h2>ShopZone</h2>
        </div>

        <nav>

            <a href="../index.html">
                Home
            </a>

            <a href="./cart.html">
                Cart
            </a>

        </nav>

    </header>


    <main class="login-page">

        <div class="login-container">

            <h1>Login</h1>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                    >

                </div>


                <button
                    type="submit"
                    class="btn buy-now"
                >
                    Login
                </button>

                <p id="loginMessage"></p>

            </form>

        </div>

    </main>


    <script
        type="module"
        src="../js/login.js"
    ></script>

</body>

</html>
